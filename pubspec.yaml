name: ease_move
description: >-
  Рухи та самопочуття. Простий застосунок повсякденних вправ:
  ми не будуємо нове тіло — ми допомагаємо краще почуватися у своєму.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.13.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  flutter_tts: ^4.2.0
  intl: ^0.20.3
  flutter_svg: ^2.0.10
  just_audio: ^0.9.40
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true

  # Generated by scripts/build_content.py from data/**.yaml.
  # The app never parses YAML at runtime (docs/TECHNICAL_SPEC.md 22).
  assets:
    - assets/content/index.json
    - assets/content/exercises/
    - assets/content/localization/
    - assets/ui/home/body/
    - assets/ui/home/cards/
    - assets/icons/
    - assets/exercises/KNEE_001/
    - assets/exercises/KNEE_002/
    - assets/exercises/KNEE_003/
    - assets/exercises/NECK_001/
    - assets/exercises/ELBOW_001/images/
    - assets/exercises/ELBOW_002/images/
    - assets/exercises/ELBOW_003/images/
    - assets/exercises/ELBOW_004/images/
    - assets/exercises/ELBOW_005/images/
    - assets/exercises/ELBOW_006/images/
    - assets/exercises/ELBOW_007/images/
    - assets/exercises/ELBOW_008/images/
    - assets/exercises/ELBOW_009/images/
    # The voice pack. Lines not recorded yet fall back to text-to-speech
    # (lib/core/audio/recorded_voice_audio_service.dart).
    - audio/uk/common/
    - audio/uk/exercises/ELBOW_001/
    - audio/uk/exercises/ELBOW_002/
    - audio/uk/exercises/ELBOW_003/
    - audio/uk/exercises/ELBOW_004/
    - audio/uk/exercises/ELBOW_005/
    - audio/uk/exercises/ELBOW_006/
    - audio/uk/exercises/ELBOW_007/
    - audio/uk/exercises/ELBOW_008/
    - audio/uk/exercises/ELBOW_009/
    - audio/uk/exercises/KNEE_001/
    - audio/uk/exercises/KNEE_002/
    - audio/uk/exercises/KNEE_003/
    - audio/uk/exercises/NECK_001/
