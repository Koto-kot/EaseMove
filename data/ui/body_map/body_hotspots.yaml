schema_version: "1.0"
screen_id: "home_body_map"
status: "tuned_against_artwork_v1"

# Coordinates are normalized 0.0-1.0 against the artwork file, not against the
# rendered box. The delivered draft was measured against the real figure with
# scripts/tune_hotspots.py (it renders the overlay this file describes over the
# PNG) and moved onto the anatomy: the neck dot sat on the mouth, the knee dots
# on the upper shin, and the foot dots below the feet entirely.
#
# `content_rect` is where the figure actually sits inside the artwork: both
# PNGs carry wide empty margins, so the app crops to this rect before scaling,
# and the hotspots are compiled into that same space by
# scripts/build_content.py. scripts/check_assets.py re-measures the PNG and
# fails if a declared rect drifts from the artwork.

artwork:
  front:
    path: "assets/ui/home/body/body_front.png"
    view: "front"
    width_px: 1086
    height_px: 1448
    content_rect: { left: 0.2726, top: 0.0304, right: 0.7155, bottom: 0.9302 }
  back_mini:
    path: "assets/ui/home/body/body_back_mini.png"
    view: "back_mini"
    width_px: 1086
    height_px: 1448
    content_rect: { left: 0.2808, top: 0.0297, right: 0.7182, bottom: 0.9233 }

ui_rules:
  persistent_text_labels: false
  hotspot_visual_style: "small_button_with_halo"
  paired_zone_highlight: true
  highlight_behavior: "pulse_then_navigate"
  pulse_duration_ms: 300
  visible_core_diameter_px: 22
  visible_halo_diameter_px: 52
  minimum_touch_target_px: 56

# Nineteen dots on one small figure means their touch targets overlap, so a tap
# is resolved by the nearest centre within this radius rather than by
# hit-testing rectangles: a tap between the knee and the calf would otherwise
# go to whichever widget happened to be on top.
tap_resolution:
  mode: "nearest_centre"
  max_distance_px: 44

hotspots:
  - id: "neck"
    view: "front"
    group: "neck"
    collection: "body_neck"
    zone: "neck"
    highlight_targets: ["neck"]
    shape: "oval"
    cx: 0.497
    cy: 0.190
    w: 0.075
    h: 0.045

  - id: "left_shoulder"
    view: "front"
    group: "both_shoulders"
    collection: "body_shoulders"
    zone: "shoulders"
    highlight_targets: ["left_shoulder", "right_shoulder"]
    shape: "oval"
    cx: 0.377
    cy: 0.232
    w: 0.075
    h: 0.055

  - id: "right_shoulder"
    view: "front"
    group: "both_shoulders"
    collection: "body_shoulders"
    zone: "shoulders"
    highlight_targets: ["left_shoulder", "right_shoulder"]
