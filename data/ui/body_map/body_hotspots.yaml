notes:
  - "Coordinates are normalized 0.0-1.0 relative to each artwork asset."
  - >-
    left_/right_ in a hotspot id is the viewer's side, as delivered in the
    pack, not the subject's own side. It carries no meaning at runtime: both
    dots of a pair highlight together and open the same collection. Exercise
    poses use the opposite convention (the subject's own side), so never map
    one onto the other.
  - "Artwork and hotspot overlays stay separate: nothing is baked into the PNG."
  - "Re-render the overlay after any artwork change: python scripts/tune_hotspots.py"
