locale:
  default: uk
  en:
    title: Chin tuck at the wall
    short_title: At the wall
    card_description: Standing at a wall, gently draw your chin back and return to neutral.
    category_label: Neck
    purpose_text: An exercise for gentle head-position control, posture and the deep neck muscles.
    start_position_title: Starting position
    start_position_text: Stand up straight against a wall. Back tall, the back of your head and your upper back
      touching the wall. Shoulders down and relaxed. Arms hanging freely. Looking straight ahead, chin in a neutral
      position.
    instructions_title: How to do it
    instructions:
    - step: 1
      text: Stand up straight at the wall, keeping the back of your head against it.
    - step: 2
      text: Look straight ahead.
    - step: 3
      text: Gently draw your chin back, as if making a double chin.
    - step: 4
      text: Hold for a few seconds and smoothly return to neutral.
    - step: 5
      text: Keep repeating at a calm pace until the time is up.
    technique_tips_title: Watch out for
    technique_tips:
    - Do not tip your head back.
    - Do not drop your chin down.
    - Your shoulders do not lift.
    - The movement happens in your neck, not by leaning your whole torso.
    safety_label: Safety
    safety_text: Move within a comfortable range. If you feel sharp pain, dizziness or any other unusual symptom,
      press Stop.
    completion_text: Done.
    halfway_text: Halfway done.
  uk:
    title: Підборіддя назад біля стіни
    short_title: Біля стіни
    card_description: Стоячи біля стіни, м'яко відводьте підборіддя назад і повертайтеся у нейтраль.
    category_label: Шия
    purpose_text: Вправа на м'який контроль положення голови, поставу та глибокі м'язи шиї.
    start_position_title: Початкове положення
    start_position_text: Станьте рівно біля стіни. Спина витягнута, потилиця і верхня частина спини біля стіни.
      Плечі розслаблені й опущені. Руки вільно вздовж тіла. Погляд прямо, підборіддя у нейтральному положенні.
    instructions_title: Як виконувати
    instructions:
    - step: 1
      text: Станьте рівно біля стіни, потилицю тримайте біля стіни.
    - step: 2
      text: Дивіться прямо перед собою.
    - step: 3
      text: М'яко потягніть підборіддя назад, ніби створюючи «подвійне підборіддя».
    - step: 4
      text: Утримайте кілька секунд і плавно поверніться у нейтраль.
    - step: 5
      text: Повторюйте рух у спокійному темпі до кінця часу.
    technique_tips_title: Зверніть увагу
    technique_tips: *id002
    safety_label: Безпека
    safety_text: Рухайтеся в комфортному діапазоні. Якщо з'явився різкий біль, запаморочення або інший незвичний
      симптом, натисніть «Стоп».
    completion_text: Готово.
    halfway_text: Половину виконано.
