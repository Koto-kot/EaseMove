locale:
  default: uk
  en:
    title: Look down
    short_title: Look down
    card_description: Seated, gently lower your head and your gaze, then return to neutral.
    category_label: Neck
    purpose_text: A starter exercise for gentle neck mobility, well suited to a calm daily routine.
    start_position_title: Starting position
    start_position_text: Sit up straight on a stable chair. Feet firmly on the floor, pelvis steady, back tall.
      Shoulders down and relaxed. Hands on your thighs. Head in a neutral position, looking straight ahead.
    instructions_title: How to do it
    instructions:
    - step: 1
      text: Sit up straight and lengthen your back.
    - step: 2
      text: Let your shoulders drop and relax.
    - step: 3
      text: Gently lower your head and your gaze, within a comfortable range.
    - step: 4
      text: Smoothly return to a neutral head position.
    - step: 5
      text: Keep repeating at a calm pace until the time is up.
    technique_tips_title: Watch out for
    technique_tips:
    - Your shoulders stay still.
    - Do not lean your torso forward.
    - Do not pull your head down by force.
    - Do not slouch.
    safety_label: Safety
    safety_text: Move within a comfortable range. If you feel sharp pain or any other unusual symptom, press Stop.
    completion_text: Done.
    halfway_text: Halfway done.
  uk:
    title: Погляд вниз
    short_title: Погляд вниз
    card_description: Сидячи, м'яко опускайте голову й погляд вниз і повертайтеся у нейтраль.
    category_label: Шия
    purpose_text: Базова вправа на м'яку рухливість шиї для спокійної щоденної практики.
    start_position_title: Початкове положення
    start_position_text: Сядьте рівно на стійкий стілець. Стопи стійко на підлозі, таз стабільний, спина витягнута.
      Плечі розслаблені й опущені. Руки лежать на стегнах. Голова у нейтральному положенні, погляд прямо.
    instructions_title: Як виконувати
    instructions:
    - step: 1
      text: Сядьте рівно, спину витягніть.
    - step: 2
      text: Плечі опустіть і розслабте.
    - step: 3
      text: М'яко опустіть голову й погляд вниз у комфортному діапазоні.
    - step: 4
      text: Плавно поверніться у нейтральне положення.
    - step: 5
      text: Повторюйте рух у спокійному темпі до кінця часу.
    technique_tips_title: Зверніть увагу
    technique_tips: *id002
    safety_label: Безпека
    safety_text: Рухайтеся в комфортному діапазоні. Якщо з'явився різкий біль або інший незвичний симптом, натисніть
      «Стоп».
    completion_text: Готово.
    halfway_text: Половину виконано.
