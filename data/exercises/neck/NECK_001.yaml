timing:
  prep_countdown_seconds: 5
  rest_after_seconds: 10
  completion_mode: prescribed_repetitions
  prescription:
    cycles: 3
    sides_per_cycle:
    - left
    - right
    hold_seconds_each_side: 5
  playback:
    move_to_side_ms: 1800
    hold_side_ms: 5000
    return_to_center_ms: 1200
    pause_in_center_ms: 500
  estimated_active_duration_seconds: 51
  progress:
    basis: sequence_time
    show_elapsed_time: true
    show_progress_bar: true
    show_repetition_counter: false
    show_side_label: false
sequence:
  repeat_cycles: 3
  steps:
  - id: center_before_left
    order: 1
    phase: neutral
    side: null
    frame_id: FRAME_CENTER
    duration_ms: 500
    voice_event: null
  - id: move_left
    order: 2
    phase: movement
    side: left
    frame_transition:
      from: FRAME_CENTER
      to: FRAME_LEFT
    duration_ms: 1800
    voice_event: VOICE_TURN_LEFT
  - id: hold_left
    order: 3
    phase: hold
    side: left
    frame_id: FRAME_LEFT
    duration_ms: 5000
    voice_event: VOICE_HOLD
  - id: return_center_from_left
    order: 4
    phase: movement
    side: left
    frame_transition:
      from: FRAME_LEFT
      to: FRAME_CENTER
    duration_ms: 1200
    voice_event: VOICE_CENTER
  - id: center_before_right
    order: 5
    phase: neutral
    side: null
    frame_id: FRAME_CENTER
    duration_ms: 500
    voice_event: null
  - id: move_right
    order: 6
    phase: movement
    side: right
    frame_transition:
      from: FRAME_CENTER
      to: FRAME_RIGHT
    duration_ms: 1800
    voice_event: VOICE_TURN_RIGHT
  - id: hold_right
    order: 7
    phase: hold
    side: right
    frame_id: FRAME_RIGHT
    duration_ms: 5000
    voice_event: VOICE_HOLD
  - id: return_center_from_right
    order: 8
    phase: movement
    side: right
    frame_transition:
      from: FRAME_RIGHT
      to: FRAME_CENTER
    duration_ms: 1200
    voice_event: VOICE_CENTER
animation:
  engine: frame_sequence
  style_profile_id: exercise_visual_v1
  loop_mode: sequence_driven
  interpolation: crossfade_or_motion_interpolation
  reduced_motion_fallback: static_step_frames
  subject:
    subject_profile_id: adult_neutral_01
    consistency_required_across_frames: true
  framing:
    view: upper_body
    camera: front
    crop: head_shoulders_upper_torso
    background: clean_neutral
    arrows_in_production_asset: false
    text_inside_asset: false
  asset_spec:
    master_format: png
    width_px: 1024
    height_px: 1024
    transparent_background_preferred: true
    production_assets_must_be_original: true
  frames:
  - id: FRAME_CENTER
    file: assets/exercises/NECK_001/frame_center.png
    pose_description_uk: Людина сидить рівно. Голова в нейтральному положенні, погляд прямо. Плечі опущені й розслаблені.
    alt_text_uk: 'Початкове положення: голова прямо, плечі розслаблені.'
    validation_points:
    - head_neutral
    - eyes_forward
    - shoulders_level
    - torso_not_rotated
  - id: FRAME_LEFT
    file: assets/exercises/NECK_001/frame_left.png
    pose_description_uk: Корпус залишається прямо. Голова повернута ліворуч у комфортному діапазоні. Підборіддя
      приблизно на тій самій висоті.
    alt_text_uk: Голова повернута ліворуч, корпус залишається прямо.
    validation_points:
    - head_rotated_left
    - chin_height_stable
    - shoulders_level
    - torso_not_rotated
  - id: FRAME_RIGHT
    file: assets/exercises/NECK_001/frame_right.png
    pose_description_uk: Корпус залишається прямо. Голова повернута праворуч у комфортному діапазоні. Підборіддя
      приблизно на тій самій висоті.
    alt_text_uk: Голова повернута праворуч, корпус залишається прямо.
    validation_points:
    - head_rotated_right
    - chin_height_stable
    - shoulders_level
    - torso_not_rotated
  preview:
    file: assets/exercises/NECK_001/preview.png
    source_frame_id: FRAME_LEFT
    overlay_text: false
audio:
  default_language: uk
  mix:
    voice_level: 1.0
    music_level_relative_to_voice: 0.5
    dynamic_ducking: false
  countdown:
    use_global_audio_pack: true
    seconds:
    - 5
    - 4
    - 3
    - 2
    - 1
  events:
  - id: VOICE_PREPARE
    type: instruction
    trigger:
      event: prep_countdown_started
      offset_ms: 0
    text_key: exercise.NECK_001.voice.prepare
    text_uk: Приготуйтеся. Сядьте рівно і розслабте плечі.
    asset_key: exercise.NECK_001.voice.prepare
    target_file: audio/uk/exercises/NECK_001/prepare.m4a
    priority: 80
    interruptible: true
  - id: VOICE_TURN_LEFT
    type: movement
    trigger:
      event: sequence_step_started
      step_id: move_left
    text_key: exercise.NECK_001.voice.turn_left
    text_uk: Повільно поверніть голову ліворуч.
    asset_key: exercise.NECK_001.voice.turn_left
    target_file: audio/uk/exercises/NECK_001/turn_left.m4a
    priority: 100
    interruptible: false
  - id: VOICE_HOLD
    type: movement
    trigger:
      event: sequence_step_started
      phase: hold
    text_key: common.voice.hold
    text_uk: Тримайте.
    asset_key: common.voice.hold
    target_file: audio/uk/common/hold.m4a
    priority: 90
    interruptible: true
  - id: VOICE_CENTER
    type: movement
    trigger:
      event: sequence_step_started
      step_id_any:
      - return_center_from_left
      - return_center_from_right
    text_key: common.voice.return_center
    text_uk: Поверніться в центр.
    asset_key: common.voice.return_center
    target_file: audio/uk/common/return_center.m4a
    priority: 100
    interruptible: false
  - id: VOICE_TURN_RIGHT
    type: movement
    trigger:
      event: sequence_step_started
      step_id: move_right
    text_key: exercise.NECK_001.voice.turn_right
    text_uk: Тепер праворуч.
    asset_key: exercise.NECK_001.voice.turn_right
    target_file: audio/uk/exercises/NECK_001/turn_right.m4a
    priority: 100
    interruptible: false
  - id: VOICE_HALFWAY
    type: progress
    trigger:
      event: progress_crossed
      percent: 50
    text_key: common.voice.halfway
    text_uk: Половину виконано.
    asset_key: common.voice.halfway
    target_file: audio/uk/common/halfway.m4a
    priority: 50
    interruptible: true
    collision_policy: delay_until_primary_cue_finishes
  - id: VOICE_LAST_CYCLE
    type: progress
    trigger:
      event: cycle_started
      cycle_number: 3
    text_key: exercise.NECK_001.voice.last_cycle
    text_uk: Останній цикл.
    asset_key: exercise.NECK_001.voice.last_cycle
    target_file: audio/uk/exercises/NECK_001/last_cycle.m4a
    priority: 60
    interruptible: true
    collision_policy: delay_until_primary_cue_finishes
  - id: VOICE_COMPLETED
    type: completion
    trigger:
      event: exercise_completed
    text_key: common.voice.completed
    text_uk: Готово.
    asset_key: common.voice.completed
    target_file: audio/uk/common/completed.m4a
    priority: 120
    interruptible: false
  recording_spec:
    current_status: not_recorded
    source_master_format: wav
    app_delivery_format: m4a
    voice_style_uk: спокійний, доброзичливий, чіткий, без поспіху
    normalization_required: true
    silence_trim_required: true
