clinical:
  status: pending_review
  publish_rule: production_requires_approved
  source_basis:
    primary_source_id: NHS_FLEXIBILITY_NECK_ROTATION
    secondary_source_ids:
    - NHS_SITTING_NECK_ROTATION
    - CUH_NECK_MOBILITY_ROTATION
    source_summary_uk: 'Базовий рух: сидіти рівно, плечі опущені, дивитися вперед; повільно повернути голову до
      лівого плеча настільки, наскільки комфортно, утримувати 5 секунд, повернутися у вихідне положення, повторити
      праворуч. У матеріалах NHS рекомендовано 3 повороти на кожен бік.

      '
  source_prescription:
    repetitions_per_side: 3
    hold_seconds: 5
    range_rule: as_far_as_comfortable
    movement_speed_rule: slow_controlled
  adaptation_notes_uk:
  - Застосунок чергує лівий і правий бік, але не змінює сам рух.
  - Час переходу між положеннями є технічним таймінгом анімації, а не окремою клінічною рекомендацією.
  - Зображення, тексти та аудіо створюються спеціально для застосунку і не копіюють ілюстрації джерел.
  safety:
    general_rule_uk: 'Виконуйте рух повільно і лише в комфортному діапазоні. Не робіть різких рухів і не змушуйте
      голову повертатися далі через силу.

      '
    stop_conditions_uk:
    - запаморочення
    - різкий або незвичний біль
    - інший новий або незвичний симптом під час виконання
    in_app_stop_message_uk: 'Зупиніть вправу, якщо вона викликає запаморочення, різкий біль або інший незвичний
      симптом.

      '
    requires_professional_review:
      prescription: true
      safety_text: true
      contraindications: true
      animation_accuracy: true
      voice_cues: true
  review:
    reviewer_role: physiotherapist_or_equivalent
    reviewer_name: null
    reviewed_at: null
    review_notes: null
    approval_version: null
  variants: []
locale:
  default: uk
  uk:
    title: Повороти голови
    short_title: Повороти
    card_description: Повільно повертайте голову ліворуч і праворуч.
    category_label: Шия
    purpose_text: Легка вправа на рухливість шиї.
    start_position_title: Початкове положення
    start_position_text: 'Сядьте рівно на стійкий стілець. Поставте стопи на підлогу. Опустіть і розслабте плечі.
      Дивіться прямо перед собою.

      '
    instructions_title: Як виконувати
    instructions:
    - step: 1
      text: Повільно поверніть голову ліворуч настільки, наскільки комфортно.
    - step: 2
      text: Утримуйте положення 5 секунд.
    - step: 3
      text: Повільно поверніться в центр.
    - step: 4
      text: Повільно поверніть голову праворуч настільки, наскільки комфортно.
    - step: 5
      text: Утримуйте положення 5 секунд.
    - step: 6
      text: Повільно поверніться в центр.
    - step: 7
      text: Повторіть 3 рази на кожен бік.
    technique_tips_title: Зверніть увагу
    technique_tips:
    - Плечі залишаються розслабленими.
    - Не повертайте разом із головою корпус.
    - Не закидайте і не опускайте підборіддя під час повороту.
    - Рухайтеся плавно, без ривків.
    safety_label: Безпека
    safety_text: 'Рухайтеся тільки в комфортному діапазоні. Якщо з''явилося запаморочення, різкий біль або інший
      незвичний симптом, натисніть «Стоп».

      '
    completion_text: Готово.
    halfway_text: Половину виконано.
    almost_done_text: Останній цикл.
