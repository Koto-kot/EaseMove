qa:
  content_checks:
  - Назва і опис відповідають руху на зображеннях.
  - Усі три кадри показують одну й ту саму людину та однаковий ракурс.
  - На лівому і правому кадрах корпус не повертається разом із головою.
  - Підборіддя не змінює висоту суттєво під час повороту.
  - Вправа присутня у collection body_neck.
  - Вправа присутня у collection computer_break.
  - Вправа присутня у collection after_sitting.
  - Усі користувацькі написи беруться через localization keys.
  - Аудіо не перекриває пріоритетні команди руху.
  - Музика не змінює гучність під час голосової команди.
  - Stop працює у будь-який момент.
  - Після штатного завершення запускається 10-секундний auto-rest.
  - Manual Previous/Next під час auto-rest скасовує autoplay.
  - Production build не показує вправу, поки clinical.status != approved.
  automated_tests:
  - id: NECK_001_VISIBLE_BODY_NECK
    expected: exercise_is_returned_for_collection_body_neck
  - id: NECK_001_VISIBLE_COMPUTER
    expected: exercise_is_returned_for_collection_computer_break
  - id: NECK_001_THREE_CYCLES
    expected: sequence_executes_three_left_right_cycles
  - id: NECK_001_FIVE_SECOND_HOLD
    expected: each_side_hold_is_5000_ms
  - id: NECK_001_LOCALIZATION
    expected: no_user_visible_hardcoded_text_outside_locale_or_resolved_preview
  - id: NECK_001_PRODUCTION_GATE
    expected: pending_review_content_is_hidden_in_production
references:
  source_ids:
  - id: NHS_FLEXIBILITY_NECK_ROTATION
    organization: NHS
    title: Flexibility exercises — Neck rotation
    evidence_used:
    - sit upright with shoulders down
    - turn left as far as comfortable
    - hold 5 seconds
    - repeat on right
    - 3 rotations on each side
  - id: NHS_SITTING_NECK_ROTATION
    organization: NHS
    title: Sitting exercises — Neck rotation
    evidence_used:
    - same basic movement and 5-second hold
    - 3 rotations on each side
  - id: CUH_NECK_MOBILITY_ROTATION
    organization: Cambridge University Hospitals NHS Foundation Trust
    title: Neck exercises and advice — Mobility exercises
    evidence_used:
    - turn head to one side until a stretch is felt
    - repeat to the other side
