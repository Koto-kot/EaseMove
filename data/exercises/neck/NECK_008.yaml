locale:
  default: uk
  en:
    title: 'Isometric: palm to temple'
    short_title: Palm to temple
    card_description: Seated, gently press your temple into your palm without tilting your head. Then change sides.
    category_label: Neck
    purpose_text: A gentle isometric exercise for the side neck muscles and for keeping your head centred.
    start_position_title: Starting position
    start_position_text: Sit up straight on a stable chair. Feet firmly on the floor, back tall, pelvis steady.
      Shoulders down and relaxed. Head in a neutral position, looking straight ahead. Your free hand rests on your
      thigh.
    instructions_title: How to do it
    instructions:
    - step: 1
      text: Sit up straight and keep your head centred.
    - step: 2
      text: Place your palm against your right temple.
    - step: 3
      text: Gently press your temple into your palm and your palm back against it; your head does not tilt.
    - step: 4
      text: Ease off the pressure and change sides.
    - step: 5
      text: Keep alternating at a calm pace until the time is up.
    technique_tips_title: Watch out for
    technique_tips:
    - Do not press hard.
    - Do not tilt your head to the side.
    - Do not lift your shoulders.
    - Do not hold your breath.
    safety_label: Safety
    safety_text: Move within a comfortable range. If you feel sharp pain, dizziness or any other unusual symptom,
      press Stop.
    completion_text: Done.
    halfway_text: Halfway done.
  uk:
    title: 'Ізометрія: долоня до скроні'
    short_title: Долоня до скроні
    card_description: Сидячи, м'яко натискайте скронею в долоню, не нахиляючи голову. Потім змініть бік.
    category_label: Шия
    purpose_text: М'яка ізометрична вправа для бічних м'язів шиї та утримання голови по центру.
    start_position_title: Початкове положення
    start_position_text: Сядьте рівно на стійкий стілець. Стопи стійко на підлозі, спина витягнута, таз стабільний.
      Плечі опущені й розслаблені. Голова у нейтральному положенні, погляд прямо. Вільна рука лежить на стегні.
    instructions_title: Як виконувати
    instructions:
    - step: 1
      text: Сядьте рівно, голову тримайте по центру.
    - step: 2
      text: Прикладіть долоню до скроні справа.
    - step: 3
      text: М'яко натискайте скронею в долоню, а долонею — назустріч; голова не нахиляється.
    - step: 4
      text: Послабте напругу і змініть бік.
    - step: 5
      text: Чергуйте боки у спокійному темпі до кінця часу.
    technique_tips_title: Зверніть увагу
    technique_tips: *id002
    safety_label: Безпека
    safety_text: Рухайтеся в комфортному діапазоні. Якщо з'явився різкий біль, запаморочення або інший незвичний
      симптом, натисніть «Стоп».
    completion_text: Готово.
    halfway_text: Половину виконано.
