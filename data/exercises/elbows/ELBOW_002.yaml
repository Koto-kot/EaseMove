clinical:
  status: pending_review
  publish_rule: production_requires_approved
  source_basis:
    basis: everyday_movement_without_clinical_prescription
    source_summary_uk: Це звичайний побутовий рух без опору. Бриф не посилається на клінічне джерело із дозуванням,
      тому тривалість і темп взяті з production brief і потребують затвердження фахівцем.
  app_prototype_prescription:
    status: pending_review
    mode: timed
    active_duration_seconds: 61
    cycle_seconds: 4.0
    range_rule: comfortable_controlled_range
    movement_speed_rule: slow_controlled
    note_uk: Тривалість і темп відповідають розділу Timing у brief. Перед production їх має затвердити фізіотерапевт.
  movement_quality:
    required_cues_uk: &id002
    - Корпус залишається вертикальним, без розгойдування.
    - Плечі опущені та розслаблені.
    - Рука, яка не працює, вільно висить уздовж тулуба.
  safety:
    general_rule_uk: Виконуйте рух повільно, у комфортному діапазоні та без ривків.
    stop_conditions_uk:
    - різкий або незвичний біль
    - раптове погіршення самопочуття
    - інший новий або незвичний симптом під час виконання
    in_app_stop_message_uk: Зупиніть вправу, якщо з'явився різкий біль або інший незвичний симптом.
    requires_professional_review:
      prescription: true
      safety_text: true
      contraindications: true
      animation_accuracy: true
      voice_cues: true
  review:
    reviewer_role: physiotherapist_or_equivalent
    reviewer_name: null
    reviewed_at: null
    review_notes: null
    approval_version: null
  variants: []
locale:
  default: uk
  uk:
    title: Почергове згинання рук
    short_title: Почергово
    card_description: Сидячи, по черзі згинайте праву та ліву руку в лікті.
    category_label: Лікті
    purpose_text: М’яка почергова вправа для ліктів і рук без опору.
    start_position_title: Початкове положення
    start_position_text: Сядьте рівно на стійкий стілець. Стопи повністю на підлозі, коліна приблизно під прямим
      кутом. Обидві руки вздовж тулуба, плечі розслаблені.
    instructions_title: Як виконувати
    instructions:
    - step: 1
      text: Сядьте рівно, руки опустіть уздовж тулуба.
    - step: 2
      text: Зігніть праву руку в лікті, підводячи кисть до рівня плеча.
    - step: 3
      text: Опустіть праву руку й одразу зігніть ліву.
    - step: 4
      text: Продовжуйте почергово, плавно та без поспіху.
    technique_tips_title: Зверніть увагу
    technique_tips: *id002
    safety_label: Безпека
    safety_text: Рухайтеся в комфортному діапазоні. Якщо з'явився різкий біль або інший незвичний симптом, натисніть
      «Стоп».
    completion_text: Готово.
    halfway_text: Половину виконано.
