audio:
  default_language: uk
  mix:
    voice_level: 1.0
    music_level_relative_to_voice: 0.5
    dynamic_ducking: false
  countdown:
    use_global_audio_pack: true
    seconds:
    - 5
    - 4
    - 3
    - 2
    - 1
  events:
  - id: VOICE_SETUP
    type: instruction
    trigger:
      event: prep_countdown_started
      offset_ms: 0
    text_key: exercise.ELBOW_002.voice.setup
    text_uk: Сядьте рівно. Руки опустіть уздовж тулуба.
    text_en: Sit up straight. Let both arms hang down beside your body.
    asset_key: exercise.ELBOW_002.voice.setup
    target_file: audio/uk/exercises/ELBOW_002/setup.m4a
    priority: 80
    interruptible: true
  - id: VOICE_START_MOVEMENT
    type: movement
    trigger:
      event: sequence_phase_started
      phase: PHASE_SETUP
    text_key: exercise.ELBOW_002.voice.start_movement
    text_uk: По черзі згинайте праву і ліву руку в лікті.
    text_en: Bend your right and your left arm at the elbow in turn.
    asset_key: exercise.ELBOW_002.voice.start_movement
    target_file: audio/uk/exercises/ELBOW_002/start_movement.m4a
    priority: 100
    interruptible: false
  - id: VOICE_HALFWAY
    type: progress
    trigger:
      event: progress_crossed
      percent: 50
    text_key: common.voice.halfway
    text_uk: Половину виконано.
    text_en: Halfway done.
    asset_key: common.voice.halfway
    target_file: audio/uk/common/halfway.m4a
    priority: 50
    interruptible: true
    collision_policy: delay_until_primary_cue_finishes
  - id: VOICE_COMPLETED
    type: completion
    trigger:
      event: exercise_completed
    text_key: common.voice.completed
    text_uk: Готово.
    text_en: Done.
    asset_key: common.voice.completed
    target_file: audio/uk/common/completed.m4a
    priority: 120
    interruptible: false
  - id: VOICE_PHASE_B
    type: movement
    voice_mode: phase_words
    trigger:
      event: sequence_phase_started
      phase: PHASE_B
    text_key: exercise.ELBOW_002.voice.phase_b
    text_uk: Ліва.
    text_en: Left.
    asset_key: exercise.ELBOW_002.voice.phase_b
    target_file: audio/uk/exercises/ELBOW_002/phase_b.m4a
    priority: 70
    interruptible: true
  - id: VOICE_PHASE_A
    type: movement
    voice_mode: phase_words
    trigger:
      event: sequence_phase_started
      phase: PHASE_A
    text_key: exercise.ELBOW_002.voice.phase_a
    text_uk: Права.
    text_en: Right.
    asset_key: exercise.ELBOW_002.voice.phase_a
    target_file: audio/uk/exercises/ELBOW_002/phase_a.m4a
    priority: 70
    interruptible: true
  - id: VOICE_COUNT_ONE
    type: movement
    voice_mode: count
    trigger:
      event: sequence_phase_started
      phase: PHASE_B
    text_key: common.voice.count_one
    text_uk: Раз.
    text_en: One.
    asset_key: common.voice.count_one
    target_file: audio/uk/common/count_one.m4a
    priority: 70
    interruptible: true
  - id: VOICE_COUNT_TWO
    type: movement
    voice_mode: count
    trigger:
      event: sequence_phase_started
      phase: PHASE_A
    text_key: common.voice.count_two
    text_uk: Два.
    text_en: Two.
    asset_key: common.voice.count_two
    target_file: audio/uk/common/count_two.m4a
    priority: 70
    interruptible: true
