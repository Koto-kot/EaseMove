  biomechanics: start_position
- id: PHASE_A
  name_uk: Права рука зігнута
  biomechanics: phase_a
- id: PHASE_B
  name_uk: Ліва рука зігнута
  biomechanics: phase_b
sequence:
  side_blocks:
  - side: null
    repeat: 1
    steps:
    - id: setup
      phase: PHASE_SETUP
      frame_id: FRAME_SETUP
      duration_ms: 1000
      voice_event: null
  - side: null
    repeat: 15
    steps:
    - id: switch_to_left
      phase: PHASE_B
      frame_transition:
        from: FRAME_RIGHT_FLEXED
        to: FRAME_LEFT_FLEXED
      duration_ms: 2000
      voice_event: null
    - id: switch_to_right
      phase: PHASE_A
      frame_transition:
        from: FRAME_LEFT_FLEXED
        to: FRAME_RIGHT_FLEXED
      duration_ms: 2000
      voice_event: null
