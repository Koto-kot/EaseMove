qa:
  content_checks:
  - Назва і опис відповідають руху на зображеннях.
  - Між motion frames змінюється лише положення рук.
  - У кадрі немає гантелей, еспандерів чи іншого опору.
  - Немає тексту, стрілок, UI чи watermark у production images.
  - Вправа присутня у collection body_elbows.
  - Усі користувацькі написи беруться через localization keys.
  - Stop працює у будь-який момент.
  - Після штатного завершення запускається 10-секундний auto-rest.
  - Production build не показує вправу, поки clinical.status != approved.
  automated_tests:
  - id: ELBOW_002_VISIBLE_BODY_ELBOWS
    expected: exercise_is_returned_for_collection_body_elbows
  - id: ELBOW_002_TIMED_COMPLETION
    expected: timeline_total_matches_estimated_active_duration
