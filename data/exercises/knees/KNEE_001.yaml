    no_watermarks: true
    original_or_properly_licensed_only: true
    clinical_pose_review_required: true
qa:
  content_checks:
  - Назва і опис відповідають руху на зображеннях.
  - Усі кадри показують одну й ту саму людину, стілець і ракурс.
  - Корпус не відхиляється назад під час розгинання.
  - Стегно робочої ноги залишається на сидінні.
  - Опускання ноги показане контрольовано, без різкого падіння стопи.
  - Вправа присутня у collection body_knees.
  - Вправа присутня у collection computer_break.
  - Вправа присутня у collection after_sitting.
  - Лічильник повторів синхронізований із sequence.
  - Автоматична зміна ноги не потребує кнопки від користувача.
  - Усі користувацькі написи беруться через localization keys.
  - Stop працює у будь-який момент.
  - Після штатного завершення запускається 10-секундний auto-rest.
  - Manual Previous/Next під час auto-rest скасовує autoplay.
  - Production build не показує вправу, поки clinical.status != approved.
  automated_tests:
  - id: KNEE_001_VISIBLE_BODY_KNEES
    expected: exercise_is_returned_for_collection_body_knees
  - id: KNEE_001_VISIBLE_COMPUTER
    expected: exercise_is_returned_for_collection_computer_break
  - id: KNEE_001_REPETITION_COUNTER
    expected: counter_tracks_completed_repetitions
  - id: KNEE_001_AUTO_SIDE_CHANGE
    expected: left_block_completion_switches_to_right_without_user_action
  - id: KNEE_001_FIVE_SECOND_HOLD
    expected: prototype_hold_is_5000_ms
  - id: KNEE_001_LOCALIZATION
    expected: no_user_visible_hardcoded_text_outside_locale_or_resolved_preview
  - id: KNEE_001_PRODUCTION_GATE
    expected: pending_review_content_is_hidden_in_production
