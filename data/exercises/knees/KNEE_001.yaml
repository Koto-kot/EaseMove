timing:
  prep_countdown_seconds: 5
  rest_after_seconds: 10
  completion_mode: prescribed_repetitions
  prescription:
    sets: 1
    repetitions_per_side: 10
    side_order:
    - left
    - right
    hold_seconds_each_repetition: 5
  playback:
    extend_leg_ms: 1800
    hold_extended_ms: 5000
    lower_leg_ms: 1800
    pause_start_position_ms: 500
  estimated_active_duration_seconds: 182
  progress:
    basis: completed_repetitions
    show_elapsed_time: true
    show_progress_bar: true
    show_repetition_counter: true
    show_side_label: true
    show_set_counter: false
repetition_model:
  type: side_blocks
  block_order:
  - left
  - right
  repetitions_per_block: 10
  sets: 1
  switch_side_automatically: true
  user_action_required_to_switch_side: false
  reset_repetition_counter_on_side_change: true
movement_phases:
- id: PHASE_START
  name_uk: Початкове положення
  biomechanics: knee_flexed_seated
- id: PHASE_EXTEND
  name_uk: Розгинання
  biomechanics: dynamic_knee_extension
- id: PHASE_HOLD
  name_uk: Утримання
  biomechanics: isometric_hold_near_extension
- id: PHASE_LOWER
  name_uk: Опускання
  biomechanics: controlled_return_to_flexion
sequence:
  side_blocks:
  - side: left
    repeat: 10
    steps:
    - id: left_start
      phase: PHASE_START
      frame_id: FRAME_START
      duration_ms: 500
      voice_event: null
    - id: left_extend
      phase: PHASE_EXTEND
      frame_transition:
        from: FRAME_START
        via: FRAME_LEFT_MID
        to: FRAME_LEFT_EXTENDED
      duration_ms: 1800
      voice_event: VOICE_EXTEND
    - id: left_hold
      phase: PHASE_HOLD
      frame_id: FRAME_LEFT_EXTENDED
      duration_ms: 5000
      voice_event: VOICE_HOLD
    - id: left_lower
      phase: PHASE_LOWER
      frame_transition:
        from: FRAME_LEFT_EXTENDED
        via: FRAME_LEFT_MID
        to: FRAME_START
      duration_ms: 1800
      voice_event: VOICE_LOWER
  - side: right
    repeat: 10
    steps:
    - id: right_start
      phase: PHASE_START
      frame_id: FRAME_START
      duration_ms: 500
      voice_event: null
    - id: right_extend
      phase: PHASE_EXTEND
      frame_transition:
        from: FRAME_START
        via: FRAME_RIGHT_MID
        to: FRAME_RIGHT_EXTENDED
      duration_ms: 1800
      voice_event: VOICE_EXTEND
    - id: right_hold
      phase: PHASE_HOLD
      frame_id: FRAME_RIGHT_EXTENDED
      duration_ms: 5000
      voice_event: VOICE_HOLD
    - id: right_lower
      phase: PHASE_LOWER
      frame_transition:
        from: FRAME_RIGHT_EXTENDED
        via: FRAME_RIGHT_MID
        to: FRAME_START
      duration_ms: 1800
      voice_event: VOICE_LOWER
animation:
  engine: frame_sequence
  style_profile_id: exercise_visual_v1
  loop_mode: repetition_driven
  interpolation: motion_interpolation
  reduced_motion_fallback: static_step_frames
  subject:
    subject_profile_id: adult_neutral_01
    consistency_required_across_frames: true
  framing:
    view: full_seated_body
    camera: three_quarter_side
    crop: head_to_feet_with_chair
    background: clean_neutral
    chair_visible: true
    arrows_in_production_asset: false
    text_inside_asset: false
  asset_spec:
    master_format: png
    width_px: 1024
    height_px: 1024
    transparent_background_preferred: true
    production_assets_must_be_original: true
  frames:
  - id: FRAME_START
    file: assets/exercises/KNEE_001/frame_start.png
    pose_description_uk: Людина сидить рівно на стійкому стільці. Обидві стопи на підлозі, коліна зігнуті приблизно
      під прямим кутом.
    alt_text_uk: Початкове положення сидячи, обидві стопи на підлозі.
    validation_points:
    - torso_upright
    - both_feet_supported
    - thighs_supported
    - knees_flexed
  - id: FRAME_LEFT_MID
    file: assets/exercises/KNEE_001/frame_left_mid.png
    pose_description_uk: Ліва гомілка піднімається вперед у процесі розгинання коліна. Стегно залишається на сидінні,
      корпус не відхиляється.
    alt_text_uk: Ліва нога частково розігнута в коліні.
    validation_points:
    - left_knee_partially_extended
    - left_thigh_supported
    - torso_upright
  - id: FRAME_LEFT_EXTENDED
    file: assets/exercises/KNEE_001/frame_left_extended.png
    pose_description_uk: Ліва нога розігнута вперед у комфортному діапазоні, носок підтягнутий у напрямку до себе.
      Праву стопу залишено на підлозі.
    alt_text_uk: Ліва нога розігнута вперед, права стопа на підлозі.
    validation_points:
    - left_knee_extended
    - left_thigh_supported
    - left_ankle_dorsiflexed
    - right_foot_supported
    - torso_upright
  - id: FRAME_RIGHT_MID
    file: assets/exercises/KNEE_001/frame_right_mid.png
    pose_description_uk: Права гомілка піднімається вперед у процесі розгинання коліна. Стегно залишається на сидінні,
      корпус не відхиляється.
    alt_text_uk: Права нога частково розігнута в коліні.
    validation_points:
    - right_knee_partially_extended
    - right_thigh_supported
    - torso_upright
  - id: FRAME_RIGHT_EXTENDED
    file: assets/exercises/KNEE_001/frame_right_extended.png
    pose_description_uk: Права нога розігнута вперед у комфортному діапазоні, носок підтягнутий у напрямку до себе.
      Ліву стопу залишено на підлозі.
    alt_text_uk: Права нога розігнута вперед, ліва стопа на підлозі.
    validation_points:
    - right_knee_extended
    - right_thigh_supported
    - right_ankle_dorsiflexed
    - left_foot_supported
    - torso_upright
  preview:
    file: assets/exercises/KNEE_001/preview.png
    source_frame_id: FRAME_LEFT_EXTENDED
    overlay_text: false
audio:
  default_language: uk
  mix:
    voice_level: 1.0
    music_level_relative_to_voice: 0.5
    dynamic_ducking: false
  countdown:
    use_global_audio_pack: true
    seconds:
    - 5
    - 4
    - 3
    - 2
    - 1
  events:
  - id: VOICE_PREPARE
    type: instruction
    trigger:
      event: prep_countdown_started
      offset_ms: 0
    text_key: exercise.KNEE_001.voice.prepare
    text_uk: Приготуйтеся. Сядьте рівно, стопи поставте на підлогу.
    text_en: Get ready. Sit up straight and place your feet on the floor.
    asset_key: exercise.KNEE_001.voice.prepare
    target_file: audio/uk/exercises/KNEE_001/prepare.m4a
    priority: 80
    interruptible: true
  - id: VOICE_EXTEND
    type: movement
    trigger:
      event: sequence_phase_started
      phase: PHASE_EXTEND
    text_key: exercise.KNEE_001.voice.extend
    text_uk: Повільно випряміть ногу.
    text_en: Slowly straighten your leg.
    asset_key: exercise.KNEE_001.voice.extend
    target_file: audio/uk/exercises/KNEE_001/extend.m4a
    priority: 100
    interruptible: false
  - id: VOICE_TOES
    type: technique
    trigger:
      event: repetition_started
      repetition_number: 1
    text_key: exercise.KNEE_001.voice.toes
    text_uk: Підтягніть носок до себе.
    text_en: Pull your toes toward you.
    asset_key: exercise.KNEE_001.voice.toes
    target_file: audio/uk/exercises/KNEE_001/toes.m4a
    priority: 70
    interruptible: true
    play_once_per_side: true
  - id: VOICE_HOLD
    type: movement
    trigger:
      event: sequence_phase_started
      phase: PHASE_HOLD
    text_key: common.voice.hold
    text_uk: Тримайте.
    text_en: Hold.
    asset_key: common.voice.hold
    target_file: audio/uk/common/hold.m4a
    priority: 90
    interruptible: true
  - id: VOICE_LOWER
    type: movement
    trigger:
      event: sequence_phase_started
      phase: PHASE_LOWER
    text_key: exercise.KNEE_001.voice.lower
    text_uk: Повільно опустіть ногу.
    text_en: Slowly lower your leg.
    asset_key: exercise.KNEE_001.voice.lower
    target_file: audio/uk/exercises/KNEE_001/lower.m4a
    priority: 100
    interruptible: false
  - id: VOICE_SWITCH_SIDE
    type: transition
    trigger:
      event: side_block_completed
      side: left
    text_key: common.voice.switch_leg
    text_uk: Тепер інша нога.
    text_en: Now the other leg.
    asset_key: common.voice.switch_leg
    target_file: audio/uk/common/switch_leg.m4a
    priority: 120
    interruptible: false
  - id: VOICE_HALFWAY
    type: progress
    trigger:
      event: progress_crossed
      percent: 50
    text_key: common.voice.halfway
    text_uk: Половину виконано.
    text_en: Halfway done.
    asset_key: common.voice.halfway
    target_file: audio/uk/common/halfway.m4a
    priority: 50
    interruptible: true
    collision_policy: delay_until_primary_cue_finishes
  - id: VOICE_LAST_REP
    type: progress
    trigger:
      event: repetition_started
      relative_position: last
    text_key: common.voice.last_repetition
    text_uk: Останній повтор.
    text_en: Last repetition.
    asset_key: common.voice.last_repetition
    target_file: audio/uk/common/last_repetition.m4a
    priority: 60
    interruptible: true
    collision_policy: delay_until_primary_cue_finishes
  - id: VOICE_COMPLETED
    type: completion
    trigger:
      event: exercise_completed
    text_key: common.voice.completed
    text_uk: Готово.
    text_en: Done.
    asset_key: common.voice.completed
    target_file: audio/uk/common/completed.m4a
    priority: 120
    interruptible: false
  recording_spec:
    current_status: not_recorded
    source_master_format: wav
    app_delivery_format: m4a
    voice_style_uk: спокійний, доброзичливий, чіткий, без поспіху
