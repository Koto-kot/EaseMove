clinical:
  status: pending_review
  publish_rule: production_requires_approved
  source_basis:
    primary_source_id: LEEDS_KNEE_EXTENSION_SITTING
    secondary_source_ids:
    - WORCS_LEG_EXTENSION_SITTING
    - UCLH_CHAIR_KNEE_EXTENSION
    - CUH_EARLY_KNEE_EXTENSION
    source_summary_uk: 'У перевірених NHS-матеріалах вправа виконується сидячи на стільці: нога повільно розгинається
      в коліні, положення коротко утримується, після чого стопа контрольовано повертається вниз. У кількох джерелах
      також рекомендується підтягувати носок у напрямку до себе.'
  source_prescriptions:
  - source_id: LEEDS_KNEE_EXTENSION_SITTING
    repetitions: 10
    hold_seconds: 5
    sets: 1
    notes_uk: Джерело описує виконання для травмованої ноги.
  - source_id: UCLH_CHAIR_KNEE_EXTENSION
    repetitions_per_leg: 10
    hold_seconds_min: 5
    hold_seconds_max: 10
    sets: 1
    notes_uk: У блоці chair exercises вказано повторювати 10 разів на кожну ногу.
  - source_id: WORCS_LEG_EXTENSION_SITTING
    repetitions: null
    hold_seconds: null
    sets: null
    notes_uk: Вказано повільно й контрольовано випрямляти коліно, утримувати кілька секунд і повільно опускати.
  app_prototype_prescription:
    status: pending_review
    mode: repetitions
    sets: 1
    repetitions_per_side: 10
    hold_seconds: 5
    side_order: left_then_right
    range_rule: comfortable_controlled_range
    movement_speed_rule: slow_controlled
    note_uk: Для тестової версії використано консервативну структуру, близьку до Leeds/UCLH. Перед production кількість
      повторів, утримання, порядок ніг і допустимі варіанти повинні бути затверджені фізіотерапевтом.
  movement_quality:
    required_cues_uk:
    - Сидіти рівно.
    - Стегно залишається на сидінні.
    - Розгинати коліно плавно, без різкого маху.
    - Повертати стопу вниз контрольовано.
    foot_position_uk: Під час розгинання можна підтягнути носок у напрямку до себе, як описано в частині NHS-матеріалів.
  safety:
    general_rule_uk: Виконуйте рух повільно, у комфортному діапазоні та без різких махів ногою.
    stop_conditions_uk:
    - різкий або незвичний біль
    - раптове погіршення самопочуття
    - інший новий або незвичний симптом під час виконання
    in_app_stop_message_uk: Зупиніть вправу, якщо з'явився різкий біль або інший незвичний симптом.
    requires_professional_review:
      prescription: true
      safety_text: true
      contraindications: true
      animation_accuracy: true
      voice_cues: true
  review:
    reviewer_role: physiotherapist_or_equivalent
    reviewer_name: null
    reviewed_at: null
    review_notes: null
    approval_version: null
  variants: []
locale:
  default: uk
  uk:
    title: Розгинання ноги сидячи
    short_title: Розгинання коліна
    card_description: Повільно випряміть ногу в коліні та контрольовано опустіть.
    category_label: Коліна
    purpose_text: Проста сидяча вправа для руху в коліні та роботи м'язів передньої поверхні стегна.
    start_position_title: Початкове положення
    start_position_text: Сядьте рівно на стійкий стілець. Стопи поставте на підлогу. Коліна зігнуті. Залиште достатньо
      місця перед собою, щоб вільно випрямити ногу.
    instructions_title: Як виконувати
    instructions:
    - step: 1
      text: Сядьте рівно, стопи поставте на підлогу.
    - step: 2
      text: Повільно випряміть ліву ногу в коліні.
    - step: 3
      text: Підтягніть носок у напрямку до себе.
    - step: 4
      text: Утримуйте ногу у випрямленому положенні 5 секунд.
    - step: 5
      text: Повільно й контрольовано опустіть стопу на підлогу.
    - step: 6
      text: Виконайте задану кількість повторів.
    - step: 7
      text: Після сигналу застосунку повторіть вправу іншою ногою.
    technique_tips_title: Зверніть увагу
    technique_tips:
    - Не відхиляйте корпус назад, щоб підняти ногу.
    - Стегно залишається на сидінні.
    - Не робіть різкого маху ногою.
    - Опускайте ногу так само плавно, як і піднімаєте.
    safety_label: Безпека
    safety_text: Рухайтеся в комфортному діапазоні. Якщо з'явився різкий біль або інший незвичний симптом, натисніть
      «Стоп».
    completion_text: Готово.
    halfway_text: Половину виконано.
    switch_side_text: Тепер інша нога.
    last_repetition_text: Останній повтор.
