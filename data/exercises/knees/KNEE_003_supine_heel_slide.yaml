    file: assets/exercises/KNEE_003/frame_start.png
    pose_description_uk: Людина лежить на спині на стабільній поверхні. Обидві ноги випрямлені, таз нейтральний.
    alt_text_uk: Початкове положення лежачи на спині з випрямленими ногами.
    validation_points:
    - supine_position
    - both_legs_extended
    - pelvis_neutral
    - surface_stable
  - id: FRAME_LEFT_MID
    file: assets/exercises/KNEE_003/frame_left_mid.png
    pose_description_uk: Ліва п’ята ковзає до тіла. Ліве коліно частково зігнуте і спрямоване вгору. Таз не повертається.
    alt_text_uk: Ліва п’ята ковзає до тіла, коліно частково зігнуте.
    validation_points:
    - left_heel_in_contact
    - left_knee_partially_flexed
