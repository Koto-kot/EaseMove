timing:
  prep_countdown_seconds: 5
  rest_after_seconds: 10
  completion_mode: prescribed_repetitions
  prescription:
    sets: 1
    repetitions_per_side: 5
    side_order:
    - left
    - right
  playback:
    slide_in_ms: 2200
    end_position_pause_ms: 500
    slide_out_ms: 2200
    start_position_pause_ms: 500
  estimated_active_duration_seconds: 54
  progress:
    basis: completed_repetitions
    show_elapsed_time: true
    show_progress_bar: true
    show_repetition_counter: true
    show_side_label: true
    show_set_counter: false
repetition_model:
  type: side_blocks
  block_order:
  - left
  - right
  repetitions_per_block: 5
  sets: 1
  switch_side_automatically: true
  user_action_required_to_switch_side: false
  reset_repetition_counter_on_side_change: true
  cycle_start_state: leg_straight
  cycle_end_state: leg_straight
movement_phases:
- id: PHASE_SUPINE_START
  name_uk: Нога випрямлена
  phase_type: start_end
- id: PHASE_SLIDE_IN
  name_uk: П’ята до себе
  phase_type: dynamic_surface_slide
- id: PHASE_KNEE_BENT
  name_uk: Коліно зігнуте
  phase_type: checkpoint
- id: PHASE_SLIDE_OUT
  name_uk: Випрямлення ноги
  phase_type: dynamic_surface_slide
sequence:
  side_blocks:
  - side: left
    repeat: 5
    steps:
    - id: left_start
      phase: PHASE_SUPINE_START
      frame_id: FRAME_START
      duration_ms: 500
      voice_event: null
    - id: left_slide_in
      phase: PHASE_SLIDE_IN
      frame_transition:
        from: FRAME_START
        via: FRAME_LEFT_MID
        to: FRAME_LEFT_BENT
      duration_ms: 2200
      voice_event: VOICE_SLIDE_IN
    - id: left_bent_checkpoint
      phase: PHASE_KNEE_BENT
      frame_id: FRAME_LEFT_BENT
      duration_ms: 500
      voice_event: VOICE_KNEE_UP
    - id: left_slide_out
      phase: PHASE_SLIDE_OUT
      frame_transition:
        from: FRAME_LEFT_BENT
        via: FRAME_LEFT_MID
        to: FRAME_START
      duration_ms: 2200
      voice_event: VOICE_SLIDE_OUT
  - side: right
    repeat: 5
    steps:
    - id: right_start
      phase: PHASE_SUPINE_START
      frame_id: FRAME_START
      duration_ms: 500
      voice_event: null
    - id: right_slide_in
      phase: PHASE_SLIDE_IN
      frame_transition:
        from: FRAME_START
        via: FRAME_RIGHT_MID
        to: FRAME_RIGHT_BENT
      duration_ms: 2200
      voice_event: VOICE_SLIDE_IN
    - id: right_bent_checkpoint
      phase: PHASE_KNEE_BENT
      frame_id: FRAME_RIGHT_BENT
      duration_ms: 500
      voice_event: VOICE_KNEE_UP
    - id: right_slide_out
      phase: PHASE_SLIDE_OUT
      frame_transition:
        from: FRAME_RIGHT_BENT
        via: FRAME_RIGHT_MID
        to: FRAME_START
      duration_ms: 2200
      voice_event: VOICE_SLIDE_OUT
