  - id: FRAME_LEFT_BENT
    file: assets/exercises/KNEE_003/frame_left_bent.png
    pose_description_uk: Ліва п’ята підтягнута до комфортної межі. Ліве коліно зігнуте і спрямоване вгору. П’ята
      залишається на поверхні.
    alt_text_uk: Ліве коліно зігнуте, п’ята залишається на поверхні.
    validation_points:
    - left_heel_in_contact
    - left_knee_flexed
    - left_knee_points_up
    - pelvis_not_rotated
  - id: FRAME_RIGHT_MID
    file: assets/exercises/KNEE_003/frame_right_mid.png
    pose_description_uk: Права п’ята ковзає до тіла. Праве коліно частково зігнуте і спрямоване вгору. Таз не повертається.
    alt_text_uk: Права п’ята ковзає до тіла, коліно частково зігнуте.
    validation_points:
    - right_heel_in_contact
    - right_knee_partially_flexed
    - right_knee_points_up
    - pelvis_not_rotated
  - id: FRAME_RIGHT_BENT
    file: assets/exercises/KNEE_003/frame_right_bent.png
    pose_description_uk: Права п’ята підтягнута до комфортної межі. Праве коліно зігнуте і спрямоване вгору. П’ята
      залишається на поверхні.
    alt_text_uk: Праве коліно зігнуте, п’ята залишається на поверхні.
    validation_points:
    - right_heel_in_contact
    - right_knee_flexed
    - right_knee_points_up
