  slug: supine_heel_slide
  internal_name: Supine heel slide
  status: draft
  availability:
    tier: free
    visible_to_free_users: true
    pro_personalization_eligible: true
  classification:
    primary_zone: knees
    secondary_zones:
    - hips
    body_map_hotspot_ids:
    - left_knee
    - right_knee
    - left_hip
    - right_hip
    collections:
    - body_knees
    - bed_basic
    - bed_legs
    - gentle_mobility
    collection_candidates:
    - morning_in_bed
    - evening_gentle
    tags:
      anatomy:
      - knees
      - hips
      context:
      - bed
      - lying
      - gentle_mobility
      position:
      - supine
      movement:
      - heel_slide
      - knee_flexion
      - knee_extension
      - hip_flexion
      - bilateral
      - surface_slide
      level:
      - beginner
      - gentle
      equipment:
      - bed_or_mat
  exercise_properties:
    difficulty: easy
    laterality: bilateral
    movement_pattern: supine_heel_slide
    preferred_position: supine
    alternative_positions: []
    equipment_required:
    - stable_lying_surface
    equipment_optional: []
    space_requirement: full_leg_length_on_surface
    functional_task: false
  anatomy:
    primary_joints:
    - knee
    secondary_joints:
    - hip
    primary_muscle_groups: []
    secondary_muscle_groups: []
    movement_plane: sagittal
    joint_actions:
    - knee_flexion_during_slide_in
    - knee_extension_during_slide_out
    - hip_flexion_during_slide_in
    - hip_extension_during_slide_out
clinical:
  status: pending_review
  publish_rule: production_requires_approved
  source_basis:
    primary_source_id: UHSUSSEX_BED_KNEE_BEND
    secondary_source_ids:
    - CUH_EARLY_KNEE_HEEL_SLIDES
    - FRIMLEY_HEEL_SLIDES
    - NBT_HEEL_SLIDES
    - WCHC_KNEE_INJURY_HEEL_SLIDES
    - OUH_HEEL_SLIDES
    source_summary_uk: 'Перевірені NHS-матеріали описують heel slide як вправу лежачи на спині: почати з випрямленої
      ноги, повільно ковзати п’ятою до сідниць, згинаючи коліно до комфортної межі, а потім повільно ковзати назад
      до випрямлення. П’ята залишається в контакті з поверхнею, а коліно під час згинання спрямоване вгору.'
  source_prescriptions:
  - source_id: UHSUSSEX_BED_KNEE_BEND
    repetitions_per_side: null
    sets: null
    hold_seconds: 0
    notes_uk: Дозування залишене для індивідуального призначення; описано повільний рух до комфортної межі та повтор
      іншою ногою.
  - source_id: NBT_HEEL_SLIDES
    repetitions_min: 5
    repetitions_max: 10
    sets: 1
    hold_seconds: 0
    notes_uk: Описано ковзання стопи до тіла й назад у положенні лежачи.
  - source_id: WCHC_KNEE_INJURY_HEEL_SLIDES
    repetitions_min: 5
    repetitions_max: 10
    sets: 1
    hold_seconds: 0
    notes_uk: Рекомендується згинати коліно настільки, наскільки можливо/комфортно.
  - source_id: OUH_HEEL_SLIDES
    repetitions_min: 5
    repetitions_max: 10
    sets: 1
    hold_seconds: 0
    notes_uk: Повільно зігнути коліно ковзанням п’яти до сідниць і повільно повернутися.
  app_prototype_prescription:
    status: pending_review
    mode: repetitions
    sets: 1
    repetitions_per_side: 5
    side_order: left_then_right
    hold_seconds: 0
    range_rule: as_far_as_comfortable
    movement_speed_rule: slow_controlled
    note_uk: Для тесту застосунку використовується 5 повторів на кожну ногу. Перед production фізіотерапевт повинен
      затвердити кількість повторів, темп, діапазон руху та допустимі поверхні.
  positioning:
    base_position: supine
    surface:
      required_type: stable_lying_surface
      allowed_prototype_values:
      - bed
      - exercise_mat
      production_values_pending_review: true
    head_support:
      required: false
      allowed: true
      specification: comfort_only_pending_review
    non_working_leg:
      prototype_position: straight_or_comfortably_supported
      production_rule_pending_review: true
    pelvis:
      target: stable_neutral
      must_not_rotate_with_working_leg: true
  surface_contact:
    working_heel:
      contact_required: true
      contact_surface: bed_or_mat
      must_slide_not_lift: true
    working_foot:
      path: toward_buttocks_then_away
      friction_sensitive: true
    working_knee:
      direction_rule: points_upward_during_flexion
  movement_quality:
    required_cues_uk:
    - Лежати зручно на спині.
    - П’ята робочої ноги залишається на поверхні.
    - Ковзати п’ятою до себе повільно.
    - Коліно під час згинання спрямоване вгору.
    - Не відривати таз і не перекручувати корпус.
    - Повільно випрямляти ногу назад.
  safety:
    environment_requirements_uk:
    - Поверхня повинна бути стійкою та достатньо довгою для повного випрямлення ніг.
    - Навколо ніг не повинно бути предметів, які заважають ковзанню п’яти.
    general_rule_uk: Рухайте п’яту повільно, без ривків і лише в комфортному діапазоні.
    stop_conditions_uk:
    - різкий або незвичний біль
    - раптове погіршення самопочуття
    - інший новий або незвичний симптом під час виконання
    in_app_stop_message_uk: Зупиніть вправу, якщо з’явився різкий біль або інший незвичний симптом.
    requires_professional_review:
      prescription: true
      safety_text: true
      contraindications: true
      surface_requirements: true
      head_support_rule: true
      animation_accuracy: true
      voice_cues: true
  variants:
  - id: VARIANT_BED
    label_uk: На ліжку
    difficulty: standard
    status: pending_review
    surface: bed
    description_uk: П’ята ковзає по поверхні ліжка. Поверхня повинна бути стійкою та не заважати плавному руху.
  - id: VARIANT_MAT
    label_uk: На килимку
    difficulty: standard
    status: pending_review
    surface: exercise_mat
    description_uk: Варіант на рівній поверхні/килимку; допустимість для production потребує клінічного затвердження.
  review:
    reviewer_role: physiotherapist_or_equivalent
    reviewer_name: null
    reviewed_at: null
    review_notes: null
    approval_version: null
locale:
  default: uk
  uk:
    title: Підтягування п’яти лежачи
    short_title: П’ята до себе
    card_description: Ковзайте п’ятою до себе, згинаючи коліно, а потім повільно випряміть ногу.
    category_label: Коліна
    purpose_text: Легка вправа лежачи для рухливості коліна та контрольованого згинання ноги.
    start_position_title: Початкове положення
    start_position_text: Ляжте на спину. Випряміть ноги та розслабтеся. П’ята робочої ноги лежить на поверхні.
    instructions_title: Як виконувати
    instructions:
    - step: 1
      text: Ляжте зручно на спину, ноги випрямлені.
    - step: 2
      text: Повільно ковзайте лівою п’ятою до себе.
    - step: 3
      text: Згинайте коліно настільки, наскільки комфортно.
    - step: 4
      text: Тримайте коліно спрямованим угору.
    - step: 5
      text: Повільно ковзайте п’ятою назад, випрямляючи ногу.
    - step: 6
      text: Виконайте задану кількість повторів.
    - step: 7
      text: Після сигналу застосунку повторіть іншою ногою.
    technique_tips_title: Зверніть увагу
    technique_tips:
    - П’ята не відривається від поверхні.
    - Коліно не завалюється вбік.
    - Таз залишається спокійним.
    - Рухайтеся плавно, без ривків.
    safety_label: Безпека
    safety_text: Рухайтеся тільки в комфортному діапазоні. Якщо з’явився різкий біль або інший незвичний симптом,
      натисніть «Стоп».
    completion_text: Готово.
    halfway_text: Половину виконано.
    switch_side_text: Тепер інша нога.
    last_repetition_text: Останній повтор.
