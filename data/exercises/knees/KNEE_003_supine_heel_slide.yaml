qa:
  content_checks:
  - Назва й опис відповідають руху на всіх кадрах.
  - Усі кадри показують одну й ту саму людину, поверхню й ракурс.
  - П’ята робочої ноги не відривається від поверхні.
  - Коліно під час згинання залишається спрямованим угору.
  - Таз не повертається слідом за ногою.
  - Є проміжний кадр ковзання п’яти.
  - Повтор зараховується лише після повернення ноги у випрямлене положення.
  - Вправа присутня у collection body_knees.
  - Вправа присутня у collection bed_basic.
  - Вправа присутня у collection bed_legs.
  - Автоматична зміна ноги не потребує кнопки від користувача.
  - Surface variant не обирається автоматично без clinical approval.
  - Усі користувацькі написи беруться через localization keys.
  - Stop працює у будь-який момент.
  - Після штатного завершення запускається 10-секундний auto-rest.
  - Manual Previous/Next під час auto-rest скасовує autoplay.
  - Production build не показує вправу, поки clinical.status != approved.
  automated_tests:
  - id: KNEE_003_VISIBLE_BODY_KNEES
    expected: exercise_is_returned_for_collection_body_knees
  - id: KNEE_003_VISIBLE_BED_BASIC
    expected: exercise_is_returned_for_collection_bed_basic
  - id: KNEE_003_HEEL_CONTACT_RULE
    expected: exercise_schema_requires_working_heel_surface_contact
  - id: KNEE_003_FULL_REP_COUNT
    expected: repetition_increments_only_after_return_to_leg_straight_state
  - id: KNEE_003_AUTO_SIDE_CHANGE
    expected: left_block_completion_switches_to_right_without_user_action
  - id: KNEE_003_SURFACE_VARIANT_GATE
    expected: unapproved_surface_variant_is_not_auto_selected
  - id: KNEE_003_LOCALIZATION
    expected: no_user_visible_hardcoded_text_outside_locale_or_resolved_preview
  - id: KNEE_003_PRODUCTION_GATE
    expected: pending_review_content_is_hidden_in_production
references:
  source_ids:
  - id: UHSUSSEX_BED_KNEE_BEND
    organization: University Hospitals Sussex NHS Foundation Trust
    title: Bed exercises — Knee Bend
    url: https://www.uhsussex.nhs.uk/resources/bed-exercises/
    evidence_used:
    - start lying with legs straight
    - slowly slide heel toward bottom
    - bend as far as comfortably possible
    - slowly straighten to start
    - repeat with other leg
  - id: CUH_EARLY_KNEE_HEEL_SLIDES
    organization: Cambridge University Hospitals NHS Foundation Trust
    title: Early knee exercises — Heel slides
    url: https://www.cuh.nhs.uk/patient-information/early-knee-exercises/
    evidence_used:
    - lie on back in comfortable position
    - bend knee keeping heel close to bed
  - id: FRIMLEY_HEEL_SLIDES
    organization: Frimley Health NHS Foundation Trust
    title: Knee Injury Advice Sheet — Heel slides
    url: https://www.fhft.nhs.uk/patients-and-visitors/patient-information-library/knee-injury-advice-sheet/submit/7561
    evidence_used:
    - lie on back with legs straight
    - slide heel toward buttocks
    - keep knee pointing to ceiling
  - id: NBT_HEEL_SLIDES
    organization: North Bristol NHS Trust
    title: Preparation for your short stay hip replacement — Heel slides
    url: https://www.nbt.nhs.uk/our-services/a-z-services/orthopaedic-planned-elective/orthopaedic-planned-patient-information-leaflets/preparation-your-short-stay-hip-replacement
    evidence_used:
    - lying on back with legs straight
    - bend and straighten hip and knee by sliding foot
    - repeat 5 to 10 times
  - id: WCHC_KNEE_INJURY_HEEL_SLIDES
    organization: Wirral Community Health and Care NHS Foundation Trust
    title: Knee injury — heel slide
    url: https://www.wchc.nhs.uk/resources/knee-injury/
    evidence_used:
    - lying down
    - gently slide heel toward bottom
    - repeat 5 to 10 times
  - id: OUH_HEEL_SLIDES
    organization: Oxford University Hospitals NHS Foundation Trust
    title: Physiotherapy Exercises — heel slide
    url: https://www.ouh.nhs.uk/patient-guide/leaflets/files/104655exercises.pdf
    evidence_used:
    - gently bend knee by sliding heel toward bottom
    - slowly return to starting position
    - repeat 5 to 10 times
