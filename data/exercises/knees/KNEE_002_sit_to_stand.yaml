clinical:
  status: pending_review
  publish_rule: production_requires_approved
  source_basis:
    primary_source_id: NHS_STRENGTH_SIT_TO_STAND
    secondary_source_ids:
    - UCLH_HOME_EXERCISES_SIT_TO_STAND
    - CUH_BALANCE_SIT_TO_STAND
    - SOUTH_TEES_SIT_TO_STAND
    - KINGSTON_FALLS_SIT_TO_STAND
    source_summary_uk: Перевірені NHS-матеріали описують вставання зі стільця з положення біля переднього краю сидіння,
      стопами на підлозі та невеликим нахилом корпусу вперед. Вставати слід повільно, переважно за рахунок ніг,
      повністю випростатися, а потім контрольовано сісти назад.
  source_prescriptions:
  - source_id: NHS_STRENGTH_SIT_TO_STAND
    repetitions: 5
    sets: 1
    tempo: slow
    arm_use: legs_primary_hands_or_arms_for_guidance_if_possible
    notes_uk: NHS радить 5 повторів; повільні повтори вважаються кращими.
  - source_id: UCLH_HOME_EXERCISES_SIT_TO_STAND
    repetitions: 10
    sets: 1
    arm_use: do_not_use_arms_to_push_if_able
    notes_uk: Сісти ближче до краю стільця, стопи на ширині таза, трохи нахилитися вперед, повільно встати ногами
      та повторити 10 разів.
  - source_id: KINGSTON_FALLS_SIT_TO_STAND
    repetitions: 10
    sets: 1
    arm_use: minimal_use_of_arms
    progression: without_using_arms
    notes_uk: Вказано мінімальну допомогу руками; варіант без рук використовується як ускладнення.
  - source_id: SOUTH_TEES_SIT_TO_STAND
    repetitions: null
    sets: null
    arm_use: null
    notes_uk: Описано перенесення плечей над стопами, випрямлення ніг до стояння та зворотний контрольований рух
      при сіданні.
  app_prototype_prescription:
    status: pending_review
    mode: repetitions
    sets: 1
    repetitions: 5
    rest_between_repetitions_seconds: 1
    tempo_rule: slow_controlled
    arm_assistance_variant: minimal_if_needed
    note_uk: Для тестової версії використовується 5 повторів відповідно до базового NHS Strength Exercise. Перед
      production фізіотерапевт повинен підтвердити кількість повторів, допустиму допомогу руками, темп і критерії
      зупинки.
  movement_quality:
    required_cues_uk:
    - Сісти ближче до переднього краю стільця.
    - Стопи впевнено стоять на підлозі.
    - Перед вставанням трохи нахилитися вперед.
    - Вставати плавно, переважно за рахунок ніг.
    - Повністю випростатися перед початком сідання.
    - Сідати повільно й контрольовано.
    - Дивитися вперед, а не вниз.
    balance_checkpoint:
      required: true
      sensor_verified: false
      user_instruction_only: true
      text_uk: Повністю випростайтеся і переконайтеся, що стоїте стійко, перш ніж починати сідання.
  safety:
    environment_requirements_uk:
    - Використовуйте міцний стійкий стілець.
    - Стілець не повинен мати коліс і не повинен ковзати.
    - Перед стільцем має бути достатньо вільного місця для безпечного вставання.
    - Стопи повинні повністю спиратися на підлогу.
    general_rule_uk: Вставайте і сідайте повільно та контрольовано. За потреби використовуйте дозволений варіант
      допомоги руками.
    stop_conditions_uk:
    - різкий або незвичний біль
    - виражене запаморочення
    - відчуття втрати рівноваги
    - раптове погіршення самопочуття
    - інший новий або незвичний симптом під час виконання
    in_app_stop_message_uk: Зупиніть вправу, якщо з'явився різкий біль, виражене запаморочення, відчуття втрати
      рівноваги або інший незвичний симптом.
    requires_professional_review:
      prescription: true
      safety_text: true
      contraindications: true
      chair_requirements: true
      arm_assistance_variants: true
      animation_accuracy: true
      voice_cues: true
  variants:
  - id: VARIANT_MINIMAL_ARM_ASSIST
    label_uk: З легкою допомогою руками
    difficulty: easier
    status: pending_review
    arm_assistance: minimal_if_needed
    description_uk: За потреби руки можуть допомагати або направляти рух. Точний спосіб допомоги повинен бути затверджений
      фізіотерапевтом.
  - id: VARIANT_NO_ARM_PUSH
    label_uk: Без відштовхування руками
    difficulty: standard_or_progression
    status: pending_review
    arm_assistance: none
    description_uk: Вставання виконується переважно за рахунок ніг без відштовхування руками.
  review:
    reviewer_role: physiotherapist_or_equivalent
    reviewer_name: null
    reviewed_at: null
    review_notes: null
    approval_version: null
locale:
  default: uk
  uk:
    title: Встати — сісти зі стільця
    short_title: Встати — сісти
    card_description: Повільно встаньте зі стільця та контрольовано сядьте назад.
    category_label: Коліна
    purpose_text: Функціональна вправа для м'язів ніг і контрольованого переходу між сидінням та стоянням.
    start_position_title: Початкове положення
    start_position_text: Сядьте ближче до переднього краю стійкого стільця. Поставте стопи на підлогу приблизно
      на ширині таза. Дивіться вперед.
    instructions_title: Як виконувати
    instructions:
    - step: 1
      text: Сядьте ближче до переднього краю стільця.
    - step: 2
      text: Поставте стопи впевнено на підлогу.
    - step: 3
      text: Трохи нахиліть корпус уперед.
    - step: 4
      text: Плавно встаньте, випрямляючи ноги.
    - step: 5
      text: Повністю випростайтеся і відчуйте стійке положення.
    - step: 6
      text: Повільно зігніть коліна й стегна та сядьте назад.
    - step: 7
      text: Повторіть задану кількість разів.
    technique_tips_title: Зверніть увагу
    technique_tips:
    - Дивіться вперед, а не в підлогу.
    - Не падайте на стілець — сідайте контрольовано.
    - Стопи залишаються на підлозі.
    - Перед сіданням повністю випростайтеся.
    - Використовуйте руки лише відповідно до обраного безпечного варіанта.
    safety_label: Безпека
    safety_text: Використовуйте тільки стійкий стілець без коліс. Якщо з'явилося запаморочення, втрата рівноваги,
      різкий біль або інший незвичний симптом, натисніть «Стоп».
    completion_text: Готово.
    halfway_text: Половину виконано.
    last_repetition_text: Останній повтор.
    stand_stable_text: Випростайтеся. Стійте стійко.
