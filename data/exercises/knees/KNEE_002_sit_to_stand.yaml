timing:
  prep_countdown_seconds: 5
  rest_after_seconds: 10
  completion_mode: prescribed_repetitions
  prescription:
    sets: 1
    repetitions: 5
  playback:
    prepare_lean_ms: 1200
    rise_ms: 2200
    stand_stable_ms: 1500
    lower_to_chair_ms: 2600
    seated_pause_ms: 800
  estimated_active_duration_seconds: 42
  progress:
    basis: completed_repetitions
    show_elapsed_time: true
    show_progress_bar: true
    show_repetition_counter: true
    show_side_label: false
    show_set_counter: false
repetition_model:
  type: full_cycle
  repetitions: 5
  sets: 1
  cycle_start_state: seated
  cycle_end_state: seated
  requires_balance_checkpoint: true
movement_phases:
- id: PHASE_SEATED
  name_uk: Сидячи
  phase_type: start_end
- id: PHASE_FORWARD_LEAN
  name_uk: Нахил уперед
  phase_type: transition
- id: PHASE_RISE
  name_uk: Вставання
  phase_type: dynamic
- id: PHASE_STAND
  name_uk: Стояння
  phase_type: checkpoint
- id: PHASE_DESCEND
  name_uk: Контрольоване сідання
  phase_type: dynamic
sequence:
  repeat: 5
  steps:
  - id: seated_start
    order: 1
    phase: PHASE_SEATED
    frame_id: FRAME_SEATED
    duration_ms: 800
    voice_event: null
  - id: forward_lean
    order: 2
    phase: PHASE_FORWARD_LEAN
    frame_transition:
      from: FRAME_SEATED
      to: FRAME_FORWARD_LEAN
    duration_ms: 1200
    voice_event: VOICE_LEAN_FORWARD
  - id: rise
    order: 3
    phase: PHASE_RISE
    frame_transition:
      from: FRAME_FORWARD_LEAN
      via: FRAME_RISING
      to: FRAME_STANDING
    duration_ms: 2200
    voice_event: VOICE_STAND_UP
  - id: stand_checkpoint
    order: 4
    phase: PHASE_STAND
    frame_id: FRAME_STANDING
    duration_ms: 1500
    voice_event: VOICE_STAND_STABLE
  - id: descend
    order: 5
    phase: PHASE_DESCEND
    frame_transition:
      from: FRAME_STANDING
      via: FRAME_DESCENDING
      to: FRAME_SEATED
    duration_ms: 2600
    voice_event: VOICE_SIT_SLOWLY
