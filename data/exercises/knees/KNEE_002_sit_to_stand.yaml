qa:
  content_checks:
  - Назва і опис відповідають руху на всіх кадрах.
  - Стілець однаковий і нерухомий на всіх кадрах.
  - Початковий кадр показує стопи на підлозі.
  - Є окремий кадр нахилу вперед до початку вставання.
  - Є проміжний кадр підйому зі стільця.
  - Є повністю випростане положення стоячи.
  - Сідання показане як контрольоване опускання, а не падіння на стілець.
  - Вправа присутня у collection body_knees.
  - Вправа присутня у collection body_hips.
  - Вправа присутня у collection after_sitting.
  - Варіанти допомоги руками не активуються автоматично без clinical approval.
  - Лічильник повторів збільшується лише після повного циклу сидячи → стоячи → сидячи.
  - Stop працює у будь-який момент.
  - Після штатного завершення запускається 10-секундний auto-rest.
  - Manual Previous/Next під час auto-rest скасовує autoplay.
  - Production build не показує вправу, поки clinical.status != approved.
  automated_tests:
  - id: KNEE_002_VISIBLE_BODY_KNEES
    expected: exercise_is_returned_for_collection_body_knees
  - id: KNEE_002_VISIBLE_BODY_HIPS
    expected: exercise_is_returned_for_collection_body_hips
  - id: KNEE_002_FULL_CYCLE_COUNT
    expected: repetition_increments_only_after_return_to_seated_state
  - id: KNEE_002_BALANCE_CHECKPOINT
    expected: standing_checkpoint_occurs_before_descend_phase
  - id: KNEE_002_CHAIR_REQUIRED
    expected: exercise_requires_stable_chair_environment
  - id: KNEE_002_VARIANT_GATE
    expected: unapproved_assistance_variant_is_not_auto_selected
  - id: KNEE_002_LOCALIZATION
    expected: no_user_visible_hardcoded_text_outside_locale_or_resolved_preview
  - id: KNEE_002_PRODUCTION_GATE
    expected: pending_review_content_is_hidden_in_production
references:
  source_ids:
  - id: NHS_STRENGTH_SIT_TO_STAND
    organization: NHS
    title: Strength exercises — Sit-to-stand
    url: https://www.nhs.uk/live-well/exercise/strength-exercises/
    evidence_used:
    - stable chair without wheels
    - sit on edge of chair
    - feet hip-width apart
    - lean slightly forward
    - stand slowly using legs
    - look forward
    - sit down slowly
    - aim for 5 repetitions
  - id: UCLH_HOME_EXERCISES_SIT_TO_STAND
    organization: University College London Hospitals NHS Foundation Trust
    title: Home exercises to improve strength and balance following hospital admission — Sit to stand
    url: https://www.uclh.nhs.uk/patients-and-visitors/patient-information-pages/home-exercises-improve-strength-and-balance-following-hospital-admission
    evidence_used:
    - sit on edge of chair
    - feet hip-width apart
    - lean forward a little
    - stand slowly using leg muscles
    - look forward
    - repeat 10 times
  - id: CUH_BALANCE_SIT_TO_STAND
    organization: Cambridge University Hospitals NHS Foundation Trust
    title: Balance exercises for cardiac rehabilitation — Sit to Stand
    url: https://www.cuh.nhs.uk/patient-information/balance-exercises-for-cardiac-rehabilitation/
    evidence_used:
    - start seated toward front of chair
    - stand without pushing off with arms
    - stand fully and establish balance before sitting
    - slowly lower back to chair
    - keep feet flat
    - look straight ahead
  - id: SOUTH_TEES_SIT_TO_STAND
    organization: South Tees Hospitals NHS Foundation Trust
    title: Sit to stand from chair — combined
    url: https://www.southtees.nhs.uk/resources/sit-to-stand-from-chair-combined/
    evidence_used:
    - lean forward to bring shoulders over feet
    - lift bottom from chair
    - straighten legs to stand
    - reverse movement with hip and knee flexion
    - lower to chair in a controlled way
  - id: KINGSTON_FALLS_SIT_TO_STAND
    organization: Kingston and Richmond NHS Foundation Trust
    title: 'Home Exercise Programme: Falls Prevention — Sit to stand'
    url: https://www.kingstonandrichmond.nhs.uk/patients-and-families/patient-leaflets/home-exercise-programme-falls-prevention
    evidence_used:
    - sit near front of chair
    - feet slightly behind knees
    - lean forward
    - stand tall with minimal arm use
    - sit slowly
    - aim for 10 repetitions
    - progress by not using arms
