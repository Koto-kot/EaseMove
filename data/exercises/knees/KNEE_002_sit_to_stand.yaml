    file: assets/exercises/KNEE_002/frame_seated.png
    pose_description_uk: Людина сидить ближче до переднього краю стільця. Стопи повністю на підлозі, погляд вперед.
    alt_text_uk: Початкове положення сидячи біля переднього краю стільця.
    validation_points:
    - feet_flat
    - feet_hip_width
    - eyes_forward
    - chair_stable
  - id: FRAME_FORWARD_LEAN
    file: assets/exercises/KNEE_002/frame_forward_lean.png
    pose_description_uk: Корпус трохи нахилений уперед, плечі переміщуються вперед над стопами. Стопи залишаються
      на підлозі.
    alt_text_uk: Легкий нахил корпусу вперед перед вставанням.
    validation_points:
