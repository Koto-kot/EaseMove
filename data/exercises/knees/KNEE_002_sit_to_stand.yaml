    pose_description_uk: Таз відірваний від стільця. Коліна та стегна розгинаються. Стопи залишаються на підлозі.
    alt_text_uk: Проміжна фаза вставання зі стільця.
    validation_points:
    - pelvis_off_chair
    - feet_flat
    - knees_extending
    - hips_extending
  - id: FRAME_STANDING
    file: assets/exercises/KNEE_002/frame_standing.png
    pose_description_uk: Людина стоїть повністю випроставшись перед стільцем, стопи на підлозі, погляд вперед.
    alt_text_uk: Повністю випростане положення стоячи.
    validation_points:
    - fully_upright
    - balanced_stance
    - feet_supported
    - eyes_forward
  - id: FRAME_DESCENDING
    file: assets/exercises/KNEE_002/frame_descending.png
    pose_description_uk: Людина контрольовано згинає стегна й коліна та опускається до стільця. Корпус трохи нахилений
      уперед.
    alt_text_uk: Контрольоване опускання назад на стілець.
    validation_points:
    - controlled_descent
    - hip_and_knee_flexion
    - feet_flat
    - chair_position_unchanged
  preview:
    file: assets/exercises/KNEE_002/preview.png
    source_frame_id: FRAME_RISING
